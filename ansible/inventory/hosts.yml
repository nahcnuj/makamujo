all:
  children:
    production:
      hosts:
        vps:
          ansible_host: makamujo
          ansible_python_interpreter: /usr/bin/python3
    local:
      hosts:
        vrt:
          ansible_connection: local
          ansible_become: false
          ansible_python_interpreter: /usr/bin/python3
        vrt-container:
          ansible_connection: docker
          ansible_become: false
          ansible_python_interpreter: /usr/bin/python3
