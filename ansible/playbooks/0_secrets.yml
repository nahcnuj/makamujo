---
# Install host secrets from Ansible Vault (e.g. Niconama stream key).
# Requires inventory/group_vars/all/vault.yml (encrypted) with niconama_stream_key.
#
#   cd ansible
#   ansible-playbook playbooks/0_secrets.yml --ask-vault-pass
#   # or: --vault-password-file .vault_pass
- name: Install makamujo host secrets
  hosts: vps
  become: true
  tasks:
    - name: Ensure secrets directory exists
      ansible.builtin.file:
        path: "{{ makamujo_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Require niconama_stream_key from vault
      ansible.builtin.assert:
        that:
          - niconama_stream_key is defined
          - niconama_stream_key | length > 0
        fail_msg: >-
          niconama_stream_key is missing or empty.
          Create inventory/group_vars/all/vault.yml from vault.yml.example
          and encrypt it with ansible-vault (see ansible/README.md).

    - name: Install niconama stream key file (/etc)
      ansible.builtin.copy:
        content: "{{ niconama_stream_key | trim }}\n"
        dest: "{{ niconama_stream_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Ensure makamujo var directory exists
      ansible.builtin.file:
        path: "{{ makamujo_src }}/var"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: makamujo_src is defined

    - name: Install niconama stream key into makamujo var
      ansible.builtin.copy:
        content: "{{ niconama_stream_key | trim }}\n"
        dest: "{{ makamujo_stream_key_path }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: makamujo_src is defined

    - name: Check OBS service.json presence
      ansible.builtin.stat:
        path: "{{ makamujo_obs_service_json }}"
      register: obs_service_json
      when: makamujo_obs_service_json is defined

    # Do not rely only on OBS start-time inject; write key into the profile now.
    - name: Inject stream key into OBS service.json
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import json, pathlib;
          p=pathlib.Path('{{ makamujo_obs_service_json }}');
          key=pathlib.Path('{{ niconama_stream_key_path }}').read_text().strip();
          d=json.loads(p.read_text());
          d.setdefault('settings',{})['key']=key;
          p.write_text(json.dumps(d, ensure_ascii=False, separators=(',', ':')));
          print(len(key))"
      register: obs_key_inject
      changed_when: true
      no_log: true
      when:
        - obs_service_json is defined
        - obs_service_json.stat is defined
        - obs_service_json.stat.exists | default(false)

    - name: Show where the key was installed
      ansible.builtin.debug:
        msg: >-
          Stream key written to {{ niconama_stream_key_path }}
          {% if makamujo_src is defined %}and {{ makamujo_stream_key_path }}{% endif %}.
          {% if obs_service_json is defined and obs_service_json.stat is defined and obs_service_json.stat.exists %}
          Injected into {{ makamujo_obs_service_json }} (key_len via inject task).
          {% else %}
          OBS service.json not found yet; bin/obs-studio will inject on launch after deploy.
          {% endif %}
