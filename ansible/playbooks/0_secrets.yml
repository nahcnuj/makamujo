---
# Write Niconama stream key into OBS service.json from Ansible Vault.
# OBS has no other stream-key source — only service.json settings.key.
#
#   cd ansible
#   ansible-playbook playbooks/0_secrets.yml --ask-vault-pass
- name: Install makamujo host secrets
  hosts: vps
  become: true
  tasks:
    - name: Require niconama_stream_key from vault
      ansible.builtin.assert:
        that:
          - niconama_stream_key is defined
          - niconama_stream_key | length > 0
        fail_msg: >-
          niconama_stream_key is missing or empty.
          Create inventory/group_vars/all/vault.yml from vault.yml.example
          and encrypt it with ansible-vault (see ansible/README.md).

    - name: Write stream key into OBS service.json
      ansible.builtin.include_tasks: tasks/write_obs_stream_key.yml

    - name: Confirm
      ansible.builtin.debug:
        msg: >-
          Stream key is only in OBS service.json
          ({{ makamujo_obs_service_json | default(makamujo_src ~ '/obs-studio/basic/profiles/Makamujo/service.json') }}).
          Re-run after playbooks/2_makamujo.yml if git reset emptied the key
          (2_makamujo re-applies automatically when vault is available).
