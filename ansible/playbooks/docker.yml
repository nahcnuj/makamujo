---
- name: Deploy makamujo streaming server in Docker (Debian 13)
  hosts: vps
  become: true
  vars:
    makamujo_src: /opt/src/makamujo
  environment:
    PATH: "/root/.bun/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    DEBIAN_FRONTEND: noninteractive
    DISPLAY: :99
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    XDG_RUNTIME_DIR: /run/user/0
    PULSE_SERVER: "unix:/run/user/0/pulse/native"
    PULSE_RUNTIME_PATH: /run/user/0/pulse
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - unzip
          - openssl
          - systemd
          - systemd-sysv
          - dbus
          - python3
          - xvfb
          - x11vnc
          - xorg
          - xdotool
          - x11-xserver-utils
          - dbus-x11
          - pipewire
          - pipewire-audio
          - pipewire-pulse
          - wireplumber
          - pulseaudio-utils
          - alsa-utils
          - libnss3
          - libgtk-3-0
          - libxss1
          - libasound2
          - libdrm2
          - libxrandr2
          - libgbm1
          - libxshmfence1
          - fonts-ipafont-gothic
          - fonts-ipafont-mincho
          - fonts-noto-cjk
        state: present

    - name: Check whether bun is already installed
      ansible.builtin.command: bun --version
      register: bun_version
      changed_when: false
      failed_when: false

    - name: Install Bun via official installer
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://bun.sh/install | bash
      args:
        executable: /bin/bash
      when: bun_version.rc != 0

    - name: Ensure Bun is on PATH for login shells
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BUN PATH"
        block: |
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
        create: true

    - name: Ensure Bun is on PATH for all login shells
      ansible.builtin.copy:
        dest: /etc/profile.d/makamujo-bun.sh
        mode: "0644"
        content: |
          export BUN_INSTALL="/root/.bun"
          export PATH="/root/.bun/bin:${PATH}"

    - name: Verify bun works with explicit path
      ansible.builtin.command: /root/.bun/bin/bun --version
      register: bun_verify
      changed_when: false

    - name: Show bun version
      ansible.builtin.debug:
        var: bun_verify.stdout

    - name: Ensure source directory exists
      ansible.builtin.file:
        path: "{{ makamujo_src }}"
        state: directory
        mode: "0755"

    - name: Install production dependencies with Bun
      ansible.builtin.command:
        cmd: bun install --production
        chdir: "{{ makamujo_src }}"

    - name: Install Playwright Chromium browser
      ansible.builtin.command:
        cmd: bunx playwright install chromium
        chdir: "{{ makamujo_src }}"
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    - name: Install Playwright system dependencies
      ansible.builtin.command:
        cmd: bunx playwright install-deps chromium
        chdir: "{{ makamujo_src }}"
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    - name: Install Xvfb for display
      ansible.builtin.apt:
        name:
          - xvfb
          - libnss3
          - libgtk-3-0
          - libxss1
          - libasound2
          - libdrm2
          - libxrandr2
          - libgbm1
          - libxshmfence1
        state: present

    - name: Set browser runtime flags for container
      ansible.builtin.command:
        cmd: /bin/true
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        DISPLAY: :99

    - name: Ensure runtime directory exists
      ansible.builtin.file:
        path: /run/user/0
        state: directory
        mode: "0700"

    - name: Route ALSA default to Pulse
      ansible.builtin.copy:
        dest: /etc/asound.conf
        mode: "0644"
        content: |
          pcm.!default { type pulse }
          ctl.!default { type pulse }

    - name: Configure environment variables for PulseAudio (pactl)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../bin/makamujo-audio.sh"
        dest: /etc/profile.d/makamujo-audio.sh
        mode: "0644"

    - name: Install makamujo-pipewire start script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../bin/makamujo-pipewire"
        dest: /usr/local/bin/makamujo-pipewire
        mode: "0755"

    - name: Install makamujo Xvfb unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/makamujo-xvfb.service
        mode: "0644"
        content: |
          [Unit]
          Description=Makamujo streaming display :99 (Docker VRT)
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Install makamujo x11vnc unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/makamujo-x11vnc.service
        mode: "0644"
        content: |
          [Unit]
          Description=Makamujo x11vnc on :99
          After=makamujo-xvfb.service
          Requires=makamujo-xvfb.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -localhost -nopw -xkb
          Restart=on-failure
          RestartSec=2
          SuccessExitStatus=2 SIGTERM

          [Install]
          WantedBy=multi-user.target

    - name: Install makamujo pipewire unit
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo-pipewire.service"
        dest: /etc/systemd/system/makamujo-pipewire.service
        remote_src: true
        mode: "0644"

    - name: Install makamujo screen unit
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo-screen.service"
        dest: /etc/systemd/system/makamujo-screen.service
        remote_src: true
        mode: "0644"

    - name: Install makamujo browser unit
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo-browser.service"
        dest: /etc/systemd/system/makamujo-browser.service
        remote_src: true
        mode: "0644"

    - name: Install makamujo obs unit
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo-obs.service"
        dest: /etc/systemd/system/makamujo-obs.service
        remote_src: true
        mode: "0644"

    - name: Install makamujo service unit
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo.service"
        dest: /etc/systemd/system/makamujo.service
        remote_src: true
        mode: "0644"

    - name: Ensure TLS directory exists
      ansible.builtin.file:
        path: "{{ makamujo_src }}/var/tls"
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate if missing
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ makamujo_src }}/var/tls/privkey.pem
          -out {{ makamujo_src }}/var/tls/fullchain.pem
          -subj /CN=127.0.0.1
      args:
        creates: "{{ makamujo_src }}/var/tls/fullchain.pem"

    - name: Restrict private key permissions
      ansible.builtin.file:
        path: "{{ makamujo_src }}/var/tls/privkey.pem"
        mode: "0600"

    - name: Adjust display number in copied service units for Docker
      ansible.builtin.replace:
        path: "/etc/systemd/system/{{ item }}"
        regexp: "DISPLAY=:10"
        replace: "DISPLAY=:99"
      loop:
        - makamujo.service
        - makamujo-pipewire.service
        - makamujo-screen.service
        - makamujo-browser.service
        - makamujo-obs.service

    - name: Write console TLS env file
      ansible.builtin.copy:
        dest: "{{ makamujo_src }}/var/console-tls.env"
        mode: "0644"
        content: |
          CONSOLE_TLS_CERT={{ makamujo_src }}/var/tls/fullchain.pem
          CONSOLE_TLS_KEY={{ makamujo_src }}/var/tls/privkey.pem
