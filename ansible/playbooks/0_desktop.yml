- name: Install X11 desktop and RDP (root session)
  hosts: vps
  become: true
  tasks:
    - name: Install desktop and RDP packages
      ansible.builtin.apt:
        name:
          - dbus-x11
          - xfce4
          - xfce4-goodies
          - xorg
          - x11-xserver-utils
          - xrdp
        state: present
        update_cache: true

    - name: Enable and start xrdp
      ansible.builtin.service:
        name: xrdp
        state: started
        enabled: true

    - name: Prefer XFCE session for xrdp
      ansible.builtin.copy:
        dest: /etc/xrdp/startwm.sh
        mode: "0755"
        content: |
          #!/bin/sh
          if test -r /etc/profile; then
            . /etc/profile
          fi
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          unset DBUS_SESSION_BUS_ADDRESS

          # Single display: enlarge this RDP session to 2560x1440 when possible.
          if command -v xrandr >/dev/null 2>&1 && command -v cvt >/dev/null 2>&1; then
            OUT=$(xrandr 2>/dev/null | awk '/ connected/{print $1; exit}')
            if [ -n "$OUT" ]; then
              MODELINE=$(cvt 2560 1440 60 2>/dev/null | awk '/Modeline/{$1=""; sub(/^ /,""); print}')
              NAME=$(echo "$MODELINE" | awk '{print $1}' | tr -d '"')
              if [ -n "$NAME" ] && [ -n "$MODELINE" ]; then
                xrandr --newmode $MODELINE 2>/dev/null || true
                xrandr --addmode "$OUT" "$NAME" 2>/dev/null || true
                xrandr --output "$OUT" --mode "$NAME" 2>/dev/null || true
              fi
            fi
          fi

          exec dbus-launch --exit-with-session startxfce4

    - name: Restart xrdp after session script change
      ansible.builtin.service:
        name: xrdp
        state: restarted

    - name: Restart xrdp-sesman after session script change
      ansible.builtin.service:
        name: xrdp-sesman
        state: restarted

    - name: Install Japanese fonts
      ansible.builtin.apt:
        name:
          - fonts-ipafont-gothic
          - fonts-ipafont-mincho
          - fonts-noto-cjk
        state: present

    - name: Install audio stack
      ansible.builtin.apt:
        name:
          - pavucontrol
          - pipewire
          - pipewire-audio
          - pipewire-pulse
          - wireplumber
        state: present

    - name: Install Chromium
      ansible.builtin.apt:
        name: chromium
        state: present
