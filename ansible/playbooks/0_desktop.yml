- name: Install X11 desktop, streaming display :10, and RDP to same display
  hosts: vps
  become: true
  tasks:
    - name: Install desktop and display packages
      ansible.builtin.apt:
        name:
          - chromium
          - dbus-x11
          - fonts-ipafont-gothic
          - fonts-ipafont-mincho
          - fonts-noto-cjk
          - pavucontrol
          - pulseaudio-utils
          - pipewire
          - pipewire-audio
          - pipewire-pulse
          - wireplumber
          - x11-xserver-utils
          - x11vnc
          - xdotool
          - xfce4
          - xfce4-goodies
          - xorg
          - xrdp
          - xvfb
        state: present
        update_cache: true

    - name: Install makamujo Xvfb unit (:10 2560x1440)
      ansible.builtin.copy:
        dest: /etc/systemd/system/makamujo-xvfb.service
        mode: "0644"
        content: |
          [Unit]
          Description=Makamujo streaming display :10 (2560x1440)
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/Xvfb :10 -screen 0 2560x1440x24 -ac +extension GLX +render -noreset
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Install makamujo x11vnc unit (share :10 on localhost:5900)
      ansible.builtin.copy:
        dest: /etc/systemd/system/makamujo-x11vnc.service
        mode: "0644"
        content: |
          [Unit]
          Description=Makamujo x11vnc on :10
          After=makamujo-xvfb.service
          Requires=makamujo-xvfb.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/x11vnc -display :10 -forever -shared -rfbport 5900 -localhost -nopw -xkb
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start makamujo-xvfb
      ansible.builtin.systemd:
        name: makamujo-xvfb
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start makamujo-x11vnc
      ansible.builtin.systemd:
        name: makamujo-x11vnc
        enabled: true
        state: started
        daemon_reload: true

    - name: Configure xrdp for Makamujo-only session (:10 via x11vnc)
      ansible.builtin.copy:
        dest: /etc/xrdp/xrdp.ini
        mode: "0644"
        content: |
          [Globals]
          ; ini_version=1
          bitmap_cache=true
          bitmap_compression=true
          port=3389
          crypt_level=low
          channel_code=1
          max_bpp=24
          use_compression=yes
          kill_disconnected=false
          tcp_nodelay=true
          tcp_keepalive=true
          security_layer=negotiate
          allow_channels=true
          allow_multimon=true
          author_pubkey=
          enable_token_login=false
          use_fastpath=both
          ssl_protocols=TLSv1.2, TLSv1.3

          [Logging]
          LogFile=xrdp.log
          LogLevel=INFO
          EnableSyslog=true

          [Channels]
          rdpdr=true
          rdpsnd=true
          drdynvc=true
          cliprdr=true
          rail=true
          xrdpvr=true

          ; Only one session: the streaming desk (:10)
          [Makamujo]
          name=Makamujo
          lib=libvnc.so
          ip=127.0.0.1
          port=5900
          username=ask
          password=ask

    - name: Prefer XFCE when a local X session is used
      ansible.builtin.copy:
        dest: /etc/xrdp/startwm.sh
        mode: "0755"
        content: |
          #!/bin/sh
          if test -r /etc/profile; then
            . /etc/profile
          fi
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-launch --exit-with-session startxfce4


    - name: Install makamujo PipeWire unit (root headless audio)
      ansible.builtin.copy:
        dest: /etc/systemd/system/makamujo-pipewire.service
        mode: "0644"
        content: |
          [Unit]
          Description=Makamujo PipeWire stack for headless streaming
          After=network.target

          [Service]
          Type=simple
          Environment=XDG_RUNTIME_DIR=/run/user/0
          Environment=HOME=/root
          RuntimeDirectory=user/0
          RuntimeDirectoryMode=0700
          ExecStartPre=/bin/mkdir -p /run/user/0
          ExecStart=/bin/sh -c 'pipewire & pipewire-pulse & exec wireplumber'
          Restart=on-failure
          RestartSec=2

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start makamujo-pipewire
      ansible.builtin.systemd:
        name: makamujo-pipewire
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start xrdp
      ansible.builtin.service:
        name: xrdp
        state: restarted
        enabled: true

    - name: Enable and start xrdp-sesman
      ansible.builtin.service:
        name: xrdp-sesman
        state: restarted
        enabled: true
