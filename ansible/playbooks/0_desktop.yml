- name: Install X11 desktop and RDP (root session)
  hosts: vps
  become: true
  tasks:
    - name: Install desktop and RDP packages
      ansible.builtin.apt:
        name:
          - dbus-x11
          - xfce4
          - xfce4-goodies
          - xorg
          - xrdp
        state: present
        update_cache: true

    - name: Enable and start xrdp
      ansible.builtin.service:
        name: xrdp
        state: started
        enabled: true

    - name: Prefer XFCE session for xrdp
      ansible.builtin.copy:
        dest: /etc/xrdp/startwm.sh
        mode: "0755"
        content: |
          #!/bin/sh
          if test -r /etc/profile; then
            . /etc/profile
          fi
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          unset DBUS_SESSION_BUS_ADDRESS
          exec dbus-launch --exit-with-session startxfce4

    - name: Restart xrdp after session script change
      ansible.builtin.service:
        name: xrdp
        state: restarted

    - name: Restart xrdp-sesman after session script change
      ansible.builtin.service:
        name: xrdp-sesman
        state: restarted

    - name: Install Japanese fonts
      ansible.builtin.apt:
        name:
          - fonts-ipafont-gothic
          - fonts-ipafont-mincho
          - fonts-noto-cjk
        state: present

    - name: Install audio stack
      ansible.builtin.apt:
        name:
          - pavucontrol
          - pipewire
          - pipewire-audio
          - pipewire-pulse
          - wireplumber
        state: present

    - name: Install Chromium
      ansible.builtin.apt:
        name: chromium
        state: present
