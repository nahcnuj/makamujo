- name: Deploy makamujo (clone, deps, console TLS)
  hosts: vps
  become: true
  vars:
    makamujo_src: /opt/src/makamujo
    tls_dir: /opt/src/makamujo/var/tls
  environment:
    PATH: "/root/.bun/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Ensure parent directory exists
      ansible.builtin.file:
        path: /opt/src
        state: directory
        mode: "0755"

    - name: Clone makamujo repository
      ansible.builtin.git:
        repo: https://github.com/nahcnuj/makamujo.git
        dest: "{{ makamujo_src }}"
        version: legacy
        force: true

    - name: Install production dependencies with Bun
      ansible.builtin.command:
        cmd: bun install --production
        chdir: "{{ makamujo_src }}"

    - name: Install Playwright Chromium browser
      ansible.builtin.command:
        cmd: bunx playwright install chromium
        chdir: "{{ makamujo_src }}"

    - name: Install Playwright system dependencies
      ansible.builtin.command:
        cmd: bunx playwright install-deps chromium
        chdir: "{{ makamujo_src }}"

    - name: Ensure TLS directory exists
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate if missing
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ tls_dir }}/privkey.pem
          -out {{ tls_dir }}/fullchain.pem
          -subj /CN=162.43.32.60
      args:
        creates: "{{ tls_dir }}/fullchain.pem"

    - name: Restrict private key permissions
      ansible.builtin.file:
        path: "{{ tls_dir }}/privkey.pem"
        mode: "0600"

    - name: Write console TLS env file
      ansible.builtin.copy:
        dest: "{{ makamujo_src }}/var/console-tls.env"
        mode: "0644"
        content: |
          CONSOLE_TLS_CERT={{ tls_dir }}/fullchain.pem
          CONSOLE_TLS_KEY={{ tls_dir }}/privkey.pem

    # git force-reset restores empty service.json key; re-apply from vault when present.

    - name: Re-apply Niconama stream key after deploy
      ansible.builtin.include_tasks: tasks/write_obs_stream_key.yml
      when:
        - niconama_stream_key is defined
        - (niconama_stream_key | length) > 0

    - name: Install makamujo-pipewire start script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../bin/makamujo-pipewire"
        dest: /usr/local/bin/makamujo-pipewire
        mode: "0755"

    - name: Restart streaming infra
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: restarted
        daemon_reload: true
      loop:
        - makamujo-xvfb.service
        - makamujo-pipewire.service
        - makamujo-x11vnc.service

    - name: Wait until PipeWire pulse socket is ready
      ansible.builtin.wait_for:
        path: /run/user/0/pulse/native
        state: present
        timeout: 60

    - name: Verify pulse server responds
      ansible.builtin.command:
        cmd: pactl info
      environment:
        XDG_RUNTIME_DIR: /run/user/0
        PULSE_SERVER: unix:/run/user/0/pulse/native
      register: pactl_info
      changed_when: false
      failed_when: pactl_info.rc != 0

    - name: Install makamujo-obs unit from repo
      ansible.builtin.copy:
        src: "{{ makamujo_src }}/etc/systemd/makamujo-obs.service"
        dest: /etc/systemd/system/makamujo-obs.service
        remote_src: true
        mode: "0644"

    - name: Enable makamujo-obs unit
      ansible.builtin.systemd:
        name: makamujo-obs
        enabled: true
        daemon_reload: true

    - name: Link makamujo-browser unit via systemctl
      ansible.builtin.command:
        cmd: systemctl link {{ makamujo_src }}/etc/systemd/makamujo-browser.service
      args:
        creates: /etc/systemd/system/makamujo-browser.service

    - name: Enable makamujo-browser unit
      ansible.builtin.systemd:
        name: makamujo-browser
        enabled: true
        daemon_reload: true

    - name: Link makamujo-screen unit via systemctl
      ansible.builtin.command:
        cmd: systemctl link {{ makamujo_src }}/etc/systemd/makamujo-screen.service
      args:
        creates: /etc/systemd/system/makamujo-screen.service

    - name: Enable makamujo-screen unit
      ansible.builtin.systemd:
        name: makamujo-screen
        enabled: true
        daemon_reload: true


    - name: Flatpak OBS headless Pulse override
      ansible.builtin.command:
        cmd: >
          flatpak override com.obsproject.Studio
          --system
          --socket=pulseaudio
          --filesystem=/run/user/0/pulse
          --env=PULSE_SERVER=unix:/run/user/0/pulse/native
          --env=XDG_RUNTIME_DIR=/run/user/0
          --env=PULSE_RUNTIME_PATH=/run/user/0/pulse
      changed_when: true

    - name: Ensure null sink for monitoring
      ansible.builtin.shell: |
        export XDG_RUNTIME_DIR=/run/user/0
        export PULSE_SERVER=unix:/run/user/0/pulse/native
        pactl load-module module-null-sink sink_name=makamujo_null sink_properties=device.description=MakamujoNull 2>/dev/null || true
        pactl set-default-sink makamujo_null 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: false

    - name: Route ALSA default to Pulse (so aplay also hits OBS Desktop Audio)
      ansible.builtin.copy:
        dest: /etc/asound.conf
        mode: "0644"
        content: |
          pcm.!default {
              type pulse
          }
          ctl.!default {
              type pulse
          }

    - name: Assert paplay reaches headless Pulse
      ansible.builtin.shell: |
        set -euo pipefail
        export XDG_RUNTIME_DIR=/run/user/0
        export PULSE_SERVER=unix:/run/user/0/pulse/native
        export PULSE_RUNTIME_PATH=/run/user/0/pulse
        test -S /run/user/0/pulse/native
        # 1秒の無音 WAV を生成して paplay（失敗したらデプロイ失敗）
        ffmpeg -f lavfi -i anullsrc=r=48000:cl=mono -t 1 -y /tmp/makamujo-audio-test.wav 2>/dev/null \
          || sox -n -r 48000 -c 1 /tmp/makamujo-audio-test.wav trim 0.0 1.0 2>/dev/null \
          || python3 -c "import wave,struct;f=wave.open('/tmp/makamujo-audio-test.wav','w');f.setnchannels(1);f.setsampwidth(2);f.setframerate(48000);f.writeframes(b'\x00\x00'*48000);f.close()"
        paplay /tmp/makamujo-audio-test.wav
      args:
        executable: /bin/bash
    - name: Restart makamujo processes
      ansible.builtin.shell: |
        set -e
        export PATH="/root/.bun/bin:${PATH}"
        export XDG_RUNTIME_DIR=/run/user/0
        export PULSE_SERVER=unix:/run/user/0/pulse/native
        cd {{ makamujo_src }}
        ./bin/stop || true
        sleep 2
        if [ -f ./var/console-tls.env ]; then
          set -a
          . ./var/console-tls.env
          set +a
        fi
        ./bin/start
        test -S /run/user/0/pulse/native
        pgrep -f 'bun start' >/dev/null
        pgrep -x obs >/dev/null || pgrep -f '/app/bin/obs' >/dev/null
      args:
        executable: /bin/bash


    - name: Assert audio path healthy after start
      ansible.builtin.shell: |
        set -e
        test -S /run/user/0/pulse/native
        XDG_RUNTIME_DIR=/run/user/0 PULSE_SERVER=unix:/run/user/0/pulse/native pactl info >/dev/null
        pgrep -f 'com.obsproject.Studio|bin/x/obs|/app/bin/obs' >/dev/null
      args:
        executable: /bin/bash
    - name: Deploy done
      ansible.builtin.debug:
        msg: Deployed; pulse socket up and processes started.

