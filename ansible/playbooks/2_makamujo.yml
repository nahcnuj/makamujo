- name: Deploy makamujo (clone, deps, console TLS)
  hosts: vps
  become: true
  vars:
    makamujo_src: /opt/src/makamujo
    tls_dir: /opt/src/makamujo/var/tls
  environment:
    PATH: "/root/.bun/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Ensure parent directory exists
      ansible.builtin.file:
        path: /opt/src
        state: directory
        mode: "0755"

    - name: Clone makamujo repository
      ansible.builtin.git:
        repo: https://github.com/nahcnuj/makamujo.git
        dest: "{{ makamujo_src }}"
        version: legacy
        force: true

    - name: Install production dependencies with Bun
      ansible.builtin.command:
        cmd: bun install --production
        chdir: "{{ makamujo_src }}"

    - name: Install Playwright Chromium browser
      ansible.builtin.command:
        cmd: bunx playwright install chromium
        chdir: "{{ makamujo_src }}"

    - name: Install Playwright system dependencies
      ansible.builtin.command:
        cmd: bunx playwright install-deps chromium
        chdir: "{{ makamujo_src }}"

    - name: Ensure TLS directory exists
      ansible.builtin.file:
        path: "{{ tls_dir }}"
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate if missing
      ansible.builtin.command:
        cmd: >
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
          -keyout {{ tls_dir }}/privkey.pem
          -out {{ tls_dir }}/fullchain.pem
          -subj /CN=162.43.32.60
      args:
        creates: "{{ tls_dir }}/fullchain.pem"

    - name: Restrict private key permissions
      ansible.builtin.file:
        path: "{{ tls_dir }}/privkey.pem"
        mode: "0600"

    - name: Write console TLS env file
      ansible.builtin.copy:
        dest: "{{ makamujo_src }}/var/console-tls.env"
        mode: "0644"
        content: |
          CONSOLE_TLS_CERT={{ tls_dir }}/fullchain.pem
          CONSOLE_TLS_KEY={{ tls_dir }}/privkey.pem

    # git force-reset restores empty service.json key; re-apply from vault when present.
    - name: Re-apply Niconama stream key after deploy
      ansible.builtin.include_tasks: tasks/write_obs_stream_key.yml
      when:
        - niconama_stream_key is defined
        - (niconama_stream_key | length) > 0


          From laptop (repo root, copy-paste one line):
            bin/vault-session run ansible vps -i ansible/inventory/hosts.yml -b -m shell -a 'cd /opt/src/makamujo && ./bin/stop && ./bin/start'

          Or on the VPS:
            export PATH="/root/.bun/bin:$PATH"
            cd /opt/src/makamujo && ./bin/stop && ./bin/start

          If OBS stream key was wiped by git reset, also:
            bin/vault-session run ansible-playbook -i ansible/inventory/hosts.yml ansible/playbooks/0_secrets.yml

    - name: Ensure streaming infra is up
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - makamujo-xvfb.service
        - makamujo-pipewire.service
        - makamujo-x11vnc.service

    - name: Restart makamujo processes
      ansible.builtin.shell: |
        set -e
        export PATH="/root/.bun/bin:${PATH}"
        cd {{ makamujo_src }}
        ./bin/stop || true
        sleep 2
        if [ -f ./var/console-tls.env ]; then
          set -a
          . ./var/console-tls.env
          set +a
        fi
        ./bin/start
      args:
        executable: /bin/bash

    - name: Deploy done
      ansible.builtin.debug:
        msg: "Deployed and restarted."
