- name: Reproduce production makamujo environment in a Debian 13 Docker container
  hosts: docker
  become: true
  vars:
    makamujo_src: /opt/src/makamujo
  tasks:
    - name: Ensure base packages for production streaming server
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - iproute2
          - tcpdump
          - procps
        state: present
        update_cache: true

    - name: Ensure Bun is installed
      ansible.builtin.command: bun --version
      register: bun_check
      changed_when: false
      failed_when: false

    - name: Install Bun via official installer
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://bun.sh/install | bash
      args:
        executable: /bin/bash
      when: bun_check.rc != 0

    - name: Install production dependencies
      ansible.builtin.command:
        cmd: bun install --production
        chdir: "{{ makamujo_src }}"
      environment:
        PATH: "/root/.bun/bin:{{ ansible_env.PATH }}"

    - name: Ensure RTMPS observation tooling is available
      ansible.builtin.package:
        name:
          - tcpdump
          - iproute2
        state: present
