---
# sshd keeps listening on TCP 22. Publickey is the only auth method.
# Unauthenticated sessions are held forever (LoginGraceTime 0) and sshd never
# disconnects an attacker itself: MaxAuthTries is huge so no "Too many
# authentication failures" cut, and MaxStartups is high enough that overload
# belongs to nobody. Once a key fails, fail2ban DROPs the IP so all further
# packets get no reply; the connection is trapped in a silent, never-answered
# key-auth state instead of being cut.
#
#   ansible-playbook playbooks/0_ssh_honeypot.yml
- name: Silence SSH clients that cannot complete publickey auth
  hosts: vps
  become: true
  tasks:
    - name: Install OpenSSH and fail2ban
      ansible.builtin.apt:
        name:
          - openssh-server
          - fail2ban
          - iptables
        state: present
        update_cache: true

    - name: Ensure sshd includes drop-in directory
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Include /etc/ssh/sshd_config.d/\*\.conf'
        line: Include /etc/ssh/sshd_config.d/*.conf
        insertbefore: BOF

    - name: Write pubkey-only sshd drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-makamujo-honeypot.conf
        mode: "0644"
        content: |
          Port 22
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          GSSAPIAuthentication no
          PermitEmptyPasswords no
          AuthenticationMethods publickey
          LoginGraceTime 0
          MaxStartups 100000:50:100000
          MaxAuthTries 100000

    - name: Validate sshd config
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload sshd
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

    - name: Confirm sshd listens on port 22
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 22
        timeout: 30

    - name: Install the honeypot-report helper for fail2ban
      ansible.builtin.copy:
        src: ../../bin/honeypot-report
        dest: /usr/local/bin/honeypot-report
        mode: "0755"
        validate: bash -n %s

    - name: Write fail2ban action that journals the caught seconds
      ansible.builtin.copy:
        src: ../../etc/fail2ban/action.d/honeypot-report.conf
        dest: /etc/fail2ban/action.d/honeypot-report.conf
        mode: "0644"

    - name: Make fail2ban log into the systemd journal
      ansible.builtin.copy:
        src: ../../etc/fail2ban/fail2ban.local
        dest: /etc/fail2ban/fail2ban.local
        mode: "0644"

    - name: Write fail2ban jail that DROP's failed key auth sources
      ansible.builtin.copy:
        src: ../../etc/fail2ban/jail.d/sshd-honeypot.conf
        dest: /etc/fail2ban/jail.d/sshd-honeypot.conf
        mode: "0644"

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
        daemon_reload: true

    - name: Reload fail2ban jails
      ansible.builtin.command:
        cmd: fail2ban-client reload
      changed_when: false
