---
# Trap SSH scanners on port 22 with Endlessh and keep them connected.
# Real sshd moves to ssh_management_port (default 22222).
#
# First apply can use port 22. After that, connect on the management port:
#   bin/deploy.sh   # probes 22222 then falls back to 22
#   ansible-playbook playbooks/0_ssh_honeypot.yml -e ansible_port=22222
- name: Trap SSH scanners with Endlessh tarpit
  hosts: vps
  become: true
  tasks:
    - name: Install OpenSSH and Endlessh
      ansible.builtin.apt:
        name:
          - openssh-server
          - endlessh
        state: present
        update_cache: true

    - name: Disable ssh.socket so sshd_config Port lines own the listeners
      ansible.builtin.systemd:
        name: ssh.socket
        state: stopped
        enabled: false
      failed_when: false

    - name: Stop Endlessh before moving listeners
      ansible.builtin.systemd:
        name: endlessh
        state: stopped
      failed_when: false

    - name: Ensure sshd includes drop-in directory
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Include /etc/ssh/sshd_config.d/\*\.conf'
        line: Include /etc/ssh/sshd_config.d/*.conf
        insertbefore: BOF

    - name: Comment Port in main sshd_config so the drop-in owns listeners
      ansible.builtin.replace:
        path: /etc/ssh/sshd_config
        regexp: '^Port\s+'
        replace: '# Port '

    - name: Probe sshd management port on loopback
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - import socket, sys; socket.create_connection(('127.0.0.1', int(sys.argv[1])), 3)
          - "{{ ssh_management_port | int }}"
      register: ssh_management_listen
      failed_when: false
      changed_when: false

    - name: Temporarily dual-listen sshd on tarpit and management ports
      when: ssh_management_listen.rc != 0
      block:
        - name: Write dual-listen sshd drop-in
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config.d/99-makamujo-management-port.conf
            mode: "0644"
            content: |
              Port {{ ssh_tarpit_port | int }}
              Port {{ ssh_management_port | int }}

        - name: Validate sshd config before dual-listen reload
          ansible.builtin.command:
            cmd: sshd -t
          changed_when: false

        - name: Reload sshd to add the management port
          ansible.builtin.systemd:
            name: ssh
            state: reloaded

        - name: Wait until sshd listens on the management port
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: "{{ ssh_management_port | int }}"
            delay: 1
            timeout: 30

    - name: Write sshd drop-in for the management port only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-makamujo-management-port.conf
        mode: "0644"
        content: |
          Port {{ ssh_management_port | int }}

    - name: Validate sshd config after dropping the tarpit port
      ansible.builtin.command:
        cmd: sshd -t
      changed_when: false

    - name: Reload sshd to leave the tarpit port
      ansible.builtin.systemd:
        name: ssh
        state: reloaded

    - name: Confirm sshd still listens on the management port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ ssh_management_port | int }}"
        timeout: 30

    - name: Wait until the tarpit port is free for Endlessh
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ ssh_tarpit_port | int }}"
        state: stopped
        timeout: 30

    - name: Ensure Endlessh config directory exists
      ansible.builtin.file:
        path: /etc/endlessh
        state: directory
        mode: "0755"

    - name: Write Endlessh tarpit config
      ansible.builtin.copy:
        dest: /etc/endlessh/config
        mode: "0644"
        content: |
          Port {{ ssh_tarpit_port | int }}
          Delay 10000
          MaxLineLength 32
          MaxClients 4096
          LogLevel 1
          BindFamily 0

    - name: Ensure Endlessh systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/endlessh.service.d
        state: directory
        mode: "0755"

    - name: Allow Endlessh to bind the privileged tarpit port
      ansible.builtin.copy:
        dest: /etc/systemd/system/endlessh.service.d/override.conf
        mode: "0644"
        content: |
          [Service]
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          PrivateUsers=false
          LimitNOFILE=65535

    - name: Enable and start Endlessh
      ansible.builtin.systemd:
        name: endlessh
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait until Endlessh listens on the tarpit port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ ssh_tarpit_port | int }}"
        timeout: 30

    - name: Allow management SSH through ufw when ufw is active
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v ufw >/dev/null 2>&1; then
          exit 0
        fi
        status="$(ufw status || true)"
        case "${status}" in
          *"Status: active"*)
            ufw allow {{ ssh_management_port | int }}/tcp
            ufw allow {{ ssh_tarpit_port | int }}/tcp
            ;;
        esac
      args:
        executable: /bin/bash
      changed_when: false

    - name: Trap is armed
      ansible.builtin.debug:
        msg: >-
          Real SSH is on TCP {{ ssh_management_port }}.
          Port {{ ssh_tarpit_port }} is Endlessh and will hold scanners.
          Next Ansible connection must use ansible_port={{ ssh_management_port }}
          (bin/deploy.sh probes that port).
          Watch catches with: journalctl -u endlessh -f
