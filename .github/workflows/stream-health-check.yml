name: Stream Health Check

on:
  schedule:
    - cron: "17 * * * *"  # Every hour at minute 17 (avoid exact hour boundaries)

permissions:
  contents: read
  issues: write
  actions: write  # Required for workflow_dispatch to trigger auto-drive

jobs:
  check-stream:
    name: Check Stream Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run stream health check
        id: stream-check
        run: bun run scripts/check-stream.ts

      - name: Create issue and trigger auto-drive
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('stream-check-result.json', 'utf8'));
            const timestamp = result.timestampJst;
            const phenomena = result.phenomena.join('\n- ');
            const details = JSON.stringify(result.details, null, 2);

            const title = `[Stream Health] 配信異常検知: ${timestamp} (JST)`;
            const body = `## 配信状況チェックで異常を検知しました

**確認時刻 (JST):** ${timestamp}

**発生事象:**
- ${phenomena}

**詳細:**
\`\`\`json
${details}
\`\`\`

---
*このIssueは自動生成されました (GitHub Actions: Stream Health Check)*`;

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug']
            });

            console.log(`Created issue #${issue.number}: ${issue.html_url}`);

            // Trigger auto-drive workflow to attempt fix
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-drive.yml',
              ref: 'main',
              inputs: {
                issue_number: String(issue.number),
                issue_title: issue.title
              }
            }).catch(err => {
              console.warn('Failed to trigger auto-drive workflow:', err.message);
            });