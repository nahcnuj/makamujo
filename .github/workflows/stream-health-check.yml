name: Stream Health Check

# This check measures the stream that is currently deployed, not the code in a
# pull request. Running the measurement on `pull_request` made every PR fail
# while the deployed stream was unhealthy, and each failure created an issue
# that auto-drive turned into another PR whose check failed the same way (the
# 2026-10-24 cascade). Keep the trigger so a required PR check still reports,
# but only scheduled and manual runs may measure the live stream, create
# issues, or drive a fix.
on:
  schedule:
    - cron: "15 * * * *"  # Every hour at minute 15 (avoid exact hour boundaries)
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-stream:
    name: Check Stream Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Skip live-stream measurement on pull requests
        if: github.event_name == 'pull_request'
        run: echo "This check measures the deployed stream, not the pull request."

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: bun ci

      - name: Install Playwright Chromium
        if: github.event_name != 'pull_request'
        run: bunx playwright install chromium

      - name: Install Japanese fonts
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run stream health check
        id: stream-check
        if: github.event_name != 'pull_request'
        run: bun run scripts/check-stream.ts

      - name: Create issue if check failed
        id: create-issue
        if: failure() && github.event_name != 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('stream-check-result.json', 'utf8'));
            const timestamp = result.timestampJst;
            const phenomena = result.phenomena.join('\n- ');
            const details = JSON.stringify(result.details, null, 2);

            const title = `[Stream Health] 配信異常検知: ${timestamp} (JST)`;
            const body = [
              "## 配信状況チェックで異常を検知しました",
              "",
              `**確認時刻 (JST):** ${timestamp}`,
              "",
              "**発生事象:**",
              `- ${phenomena}`,
              "",
              "**詳細:**",
              "```json",
              details,
              "```",
              "",
              "---",
              "*このIssueは自動生成されました (GitHub Actions: Stream Health Check)*",
            ].join("\n");

            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug']
            });

            console.log(`Created issue #${issue.number}: ${issue.html_url}`);
            core.setOutput('issue-number', String(issue.number));

  auto-drive:
    name: Auto-drive fix
    needs: check-stream
    if: failure() && github.event_name != 'pull_request' && needs.check-stream.result == 'failure' && needs.check-stream.outputs.issue-number != ''
    # Reusable workflow call jobs cannot declare a job-level `environment`;
    # it is passed as an input below so the App secrets are resolved from
    # makamujo's `conahcnuj` environment inside the reusable workflow.
    # Call the conahcnuj reusable workflow directly (pin to a commit so an
    # upstream change cannot alter this repository's CI without a review).
    uses: nahcnuj/conahcnuj/.github/workflows/issue-driver.yml@7c39b13439cecfd7fa2a10e2ae4b75b2d9ddd778
    with:
      # fromJSON: step outputs are strings, but the reusable workflow's
      # `number` input is typed as a number.
      number: ${{ fromJSON(needs.check-stream.outputs.issue-number) }}
      # The caller's repository owns the issue; the reusable workflow's
      # default would drive conahcnuj instead.
      repository: ${{ github.repository }}
      # Same environment as the job above: it holds the App secrets and
      # wins over the inherited ones.
      environment: conahcnuj
    secrets: inherit
