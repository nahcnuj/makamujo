name: Stream Health Check

on:
  schedule:
    - cron: "5/15 * * * *"  # Every hour at minute 15 (avoid exact hour boundaries)
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/stream-health-check.yml'
  workflow_dispatch:  # Allow manual trigger for testing

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-stream:
    name: Check Stream Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      issue-number: ${{ steps.create-issue.outputs.issue-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun ci

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run stream health check
        id: stream-check
        run: bun run scripts/check-stream.ts

      - name: Create issue if check failed
        id: create-issue
        if: steps.stream-check.outcome == 'failure' || failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('stream-check-result.json', 'utf8'));
            const timestamp = result.timestampJst;
            const phenomena = result.phenomena.join('\n- ');
            const details = JSON.stringify(result.details, null, 2);

            const logBody = [
              `**確認時刻 (JST):** ${timestamp}`,
              "",
              "**発生事象:**",
              `- ${phenomena}`,
              "",
              "**詳細:**",
              "```json",
              details,
              "```",
            ].join("\n");

            const commentBody = [
              "## 配信異常検知ログ",
              "",
              logBody,
              "",
              "---",
              "*このコメントは自動生成されました (GitHub Actions: Stream Health Check)*",
            ].join("\n");

            // At most one open "配信異常検知" issue: reuse an existing one if present.
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.title.includes('配信異常検知'),
            );

            let issueNumber;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: commentBody,
              });
              issueNumber = existing.number;
              console.log(`Commented on existing issue #${existing.number}: ${existing.html_url}`);
            } else {
              const title = `[Stream Health] 配信異常検知`;
              const body = [
                "## 配信状況チェックで異常を検知しました",
                "",
                "詳細はコメントを参照してください。",
                "",
                "---",
                "*このIssueは自動生成されました (GitHub Actions: Stream Health Check)*",
              ].join("\n");

              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug', 'self-improvement'],
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody,
              });

              issueNumber = issue.number;
              console.log(`Created issue #${issue.number}: ${issue.html_url}`);
            }

            core.setOutput('issue-number', String(issueNumber));
