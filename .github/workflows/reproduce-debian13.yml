name: Debian 13 Docker Ansible RTMPS

on:
  push:
    branches: [main, legacy]
  pull_request:
    branches: [main, legacy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13-docker-ansible-rtmps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian 13 container
        run: docker build -t makamujo/debian13-ansible -f Dockerfile .

      - name: Start Debian 13 container
        run: |
          set -euo pipefail
          docker run -d --name makamujo-debian13 \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            makamujo/debian13-ansible

      - name: Wait for container
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec makamujo-debian13 true; then break; fi
            sleep 2
          done
          docker exec makamujo-debian13 cat /etc/os-release

      - name: Install Ansible on runner
        run: pip install -r ansible/requirements.txt

      - name: Run Ansible in Debian 13 container
        run: |
          set -euo pipefail
          docker cp . makamujo-debian13:/work
          docker exec makamujo-debian13 bash -lc \
            'cd /work && ansible-playbook -i localhost, -c local ansible/playbooks/docker_debian13.yml'

      - name: Observe outbound RTMPS traffic
        env:
          RTMPS_URL: rtmps://example.com/live/stream
        run: |
          set -euo pipefail
          docker exec -e RTMPS_URL="$RTMPS_URL" makamujo-debian13 \
            bash -lc '/usr/local/bin/observe-rtmps.sh'
          docker exec makamujo-debian13 sh -c 'ls -l /tmp/rtmps-capture.pcap'

      - name: Verify RTMPS traffic was captured
        run: |
          set -euo pipefail
          docker exec makamujo-debian13 sh -c 'test -s /tmp/rtmps-capture.pcap'
          echo "RTMPS communication observed"

      - name: Cleanup
        if: always()
        run: docker rm -f makamujo-debian13 || true
