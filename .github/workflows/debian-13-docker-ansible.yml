name: Debian 13 Docker RTMPS

on:
  push:
    branches: [main, legacy]
  pull_request:
    branches: [main, legacy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian13-docker-rtmps:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build Debian 13 container
        run: docker build -t makamujo/debian13 -f docker/Dockerfile .

      - name: Start Debian 13 container
        run: |
          set -euo pipefail
          docker run -d --name makamujo-debian13 \
            --privileged \
            -p 2222:22 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            makamujo/debian13

      - name: Wait for container and configure SSH
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec makamujo-debian13 true; then break; fi
            sleep 2
          done
          docker exec makamujo-debian13 cat /etc/os-release

          ssh-keygen -t ed25519 -N "" -f /tmp/debian13_key
          docker exec makamujo-debian13 mkdir -p /root/.ssh
          docker cp /tmp/debian13_key.pub makamujo-debian13:/root/.ssh/authorized_keys
          docker exec makamujo-debian13 chmod 700 /root/.ssh
          docker exec makamujo-debian13 chmod 600 /root/.ssh/authorized_keys

          mkdir -p ~/.ssh
          cp /tmp/debian13_key ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          for i in $(seq 1 30); do
            if ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy root@127.0.0.1 true 2>/dev/null; then
              break
            fi
            sleep 2
          done
          ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy root@127.0.0.1 true

      - name: Install Ansible on runner
        run: pip install -r ansible/requirements.txt

      - name: Provision production (bootstrap)
        env:
          VPS_SSH_HOST: 127.0.0.1
          VPS_SSH_USER: root
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p 2222
        run: |
          set -euo pipefail
          DEPLOY_PLAYBOOK=ansible/playbooks/0_bootstrap.yml bin/deploy.sh

      - name: Provision production (Bun)
        env:
          VPS_SSH_HOST: 127.0.0.1
          VPS_SSH_USER: root
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p 2222
        run: |
          set -euo pipefail
          DEPLOY_PLAYBOOK=ansible/playbooks/1_bun.yml bin/deploy.sh

      - name: Provision production (makamujo)
        env:
          VPS_SSH_HOST: 127.0.0.1
          VPS_SSH_USER: root
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p 2222
        run: |
          set -euo pipefail
          bin/deploy.sh

      - name: Install RTMPS observation helper
        run: |
          set -euo pipefail
          docker cp bin/observe-rtmps.sh makamujo-debian13:/usr/local/bin/observe-rtmps.sh
          docker exec makamujo-debian13 chmod 0755 /usr/local/bin/observe-rtmps.sh

      - name: Observe outbound RTMPS traffic
        env:
          RTMPS_URL: rtmps://example.com/live/stream
        run: |
          set -euo pipefail
          docker exec -e RTMPS_URL="$RTMPS_URL" makamujo-debian13 \
            /usr/local/bin/observe-rtmps.sh

      - name: Verify RTMPS traffic was captured
        run: |
          set -euo pipefail
          docker exec makamujo-debian13 sh -c 'test -s /tmp/rtmps-capture.pcap'
          echo "RTMPS communication observed"

      - name: Cleanup
        if: always()
        run: docker rm -f makamujo-debian13 || true
