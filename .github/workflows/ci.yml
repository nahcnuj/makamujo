name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy
  # CD（cd.yml）が CI の push run を待てなかったときにここから起動する。
  # workflow_dispatch は GITHUB_TOKEN / App token でも発火するため、
  # push イベントが起きないマージでも CI → CD の経路を構成できる。
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        # bin/ のエントリポイント (start / stop / makamujo-pipewire) は拡張子なしなので
        # '*.sh' だけでは lint されず、起動に直結するスクリプトが検査を素通りしていた。
        run: |
          find bin scripts -type f \( -name '*.sh' -o -name start -o -name stop -o -name makamujo-pipewire \) -print0 \
            | xargs -0 -r shellcheck

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run VRT
        run: bash tests/vrt.sh

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  rtmps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Restore provisioned image from cache
        id: provisioned-image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: makamujo-provisioned.tar
          key: makamujo-provisioned-${{ hashFiles('Dockerfile', 'ansible/**', 'compose.yml', 'bin/**', 'etc/**', 'package.json', 'bun.lock', 'bun.lockb') }}

      - name: Load provisioned image (if cached)
        if: steps.provisioned-image-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          docker load -i makamujo-provisioned.tar

      - name: Cache ffmpeg binary
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ffmpeg-bin
          key: ffmpeg-bundle-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install ffmpeg (for VRT frame comparison)
        run: |
          set -euo pipefail
          cache_dir="${HOME}/.cache/ffmpeg-bin"
          mkdir -p "${cache_dir}/lib"
          if [ -x "${cache_dir}/ffmpeg" ] && [ -x "${cache_dir}/ffprobe" ] && \
             LD_LIBRARY_PATH="${cache_dir}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
             "${cache_dir}/ffmpeg" -version >/dev/null 2>&1; then
            sudo install -m 0755 "${cache_dir}/ffmpeg" /usr/local/bin/ffmpeg
            sudo install -m 0755 "${cache_dir}/ffprobe" /usr/local/bin/ffprobe
            echo "LD_LIBRARY_PATH=${cache_dir}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
          elif command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            cp "$(command -v ffmpeg)" "${cache_dir}/ffmpeg"
            cp "$(command -v ffprobe)" "${cache_dir}/ffprobe"
            ldd "$(command -v ffmpeg)" | awk '/=>/ {print $3}' | while read -r lib; do [ -f "$lib" ] && cp "$lib" "${cache_dir}/lib/"; done
            ldd "$(command -v ffprobe)" | awk '/=>/ {print $3}' | while read -r lib; do [ -f "$lib" ] && cp "$lib" "${cache_dir}/lib/"; done
            sudo install -m 0755 "$(command -v ffmpeg)" /usr/local/bin/ffmpeg
            sudo install -m 0755 "$(command -v ffprobe)" /usr/local/bin/ffprobe
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
            cp "$(command -v ffmpeg)" "${cache_dir}/ffmpeg"
            cp "$(command -v ffprobe)" "${cache_dir}/ffprobe"
            ldd "$(command -v ffmpeg)" | awk '/=>/ {print $3}' | while read -r lib; do [ -f "$lib" ] && cp "$lib" "${cache_dir}/lib/"; done
            ldd "$(command -v ffprobe)" | awk '/=>/ {print $3}' | while read -r lib; do [ -f "$lib" ] && cp "$lib" "${cache_dir}/lib/"; done
            sudo install -m 0755 "$(command -v ffmpeg)" /usr/local/bin/ffmpeg
            sudo install -m 0755 "$(command -v ffprobe)" /usr/local/bin/ffprobe
          fi

      - name: Install Ansible (for provisioning, cache-miss only)
        if: steps.provisioned-image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          pip install -r ansible/requirements.txt

      - name: Prepare RTMPS certificates
        run: |
          set -euo pipefail
          cert_dir="${RUNNER_TEMP}/certs"
          mkdir -p "${cert_dir}"
          echo "RTMPS_CERTS_DIR=${cert_dir}" >> "${GITHUB_ENV}"
          # Use a real CA + server-certificate chain. A bare self-signed leaf is
          # rejected by some TLS stacks even when it is placed in the trust
          # store, and both ffmpeg (capture) and OBS (publisher) must trust it.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "${cert_dir}/ca-key.pem" \
            -out "${cert_dir}/ca.pem" \
            -subj /CN=makamujo-rtmps-ca \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout "${cert_dir}/key.pem" \
            -out "${cert_dir}/cert.csr" \
            -subj /CN=mediamtx
          cat > "${cert_dir}/ext.cnf" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:mediamtx,DNS:localhost,IP:127.0.0.1
          EOF
          openssl x509 -req \
            -in "${cert_dir}/cert.csr" \
            -CA "${cert_dir}/ca.pem" \
            -CAkey "${cert_dir}/ca-key.pem" \
            -CAcreateserial -days 1 \
            -out "${cert_dir}/cert.pem" \
            -extfile "${cert_dir}/ext.cnf"

          # Expose the per-run CA to the Docker build context so the Dockerfile can
          # bake it into the image's trust store (see Dockerfile).
          cp "${cert_dir}/ca.pem" "${GITHUB_WORKSPACE}/ca.pem"

      - name: Trust the RTMPS CA on the runner
        run: |
          set -euo pipefail
          sudo cp "${RTMPS_CERTS_DIR}/ca.pem" /usr/local/share/ca-certificates/mediamtx-ca.crt
          sudo update-ca-certificates

      - name: Start the Docker Compose stack
        run: |
          set -euo pipefail
          # The makamujo service has an sshd healthcheck in compose.yml, so wait
          # for it to become healthy instead of polling pgrep manually.
          docker compose up -d --wait --wait-timeout 120 makamujo mediamtx

      - name: Provision the container with Ansible
        if: steps.provisioned-image-cache.outputs.cache-hit != 'true'
        working-directory: ansible
        env:
          ANSIBLE_PIPELINING: "1"
          ANSIBLE_GATHERING: explicit
        run: |
          set -euo pipefail
          ansible-playbook -i inventories/docker.yml \
            playbooks/0_bootstrap.yml \
            playbooks/0_desktop.yml \
            playbooks/0_obs.yml \
            playbooks/1_bun.yml \
            playbooks/2_makamujo.yml

      - name: Clean package caches before committing provisioned image
        if: steps.provisioned-image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker compose exec -T makamujo bash -c '
            set -e
            apt-get clean || true
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* 2>/dev/null || true
            rm -rf /root/.cache /root/.npm 2>/dev/null || true
            rm -rf /opt/src/makamujo/.git 2>/dev/null || true
            rm -rf /tmp/* /var/tmp/* /var/log/* 2>/dev/null || true
          '

      - name: Commit provisioned container to a cacheable image
        if: steps.provisioned-image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          docker commit --pause=false makamujo makamujo:prod
          docker save makamujo:prod | gzip -1 > makamujo-provisioned.tar

      - name: Save provisioned image to cache
        if: steps.provisioned-image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: makamujo-provisioned.tar
          key: makamujo-provisioned-${{ hashFiles('Dockerfile', 'ansible/**', 'compose.yml', 'bin/**', 'etc/**', 'package.json', 'bun.lock', 'bun.lockb') }}

      - name: Trust the RTMPS CA inside the container
        run: |
          set -euo pipefail
          docker compose exec -T makamujo sh -c 'cat > /usr/local/share/ca-certificates/mediamtx-ca.crt && update-ca-certificates' < "${RTMPS_CERTS_DIR}/ca.pem"

      - name: Overlay PR source into the container
        run: |
          set -euo pipefail
          # OBS rewrites its profile and scene collection when it exits. The
          # cached provisioned image starts OBS with a configuration from an
          # older revision, so stop it *before* overlaying the checked-out
          # source. Otherwise stopping it later writes that stale configuration
          # back over the PR files and the browser source shows an old/blank
          # overlay instead of the one under review.
          docker compose exec -T makamujo systemctl stop makamujo-obs.service
          # The provisioned image is built from main, so overlay the checked-out
          # (PR) source on top of it before OBS captures the stream. This keeps
          # the RTMPS VRT exercising the code under review instead of main.
          tar --exclude='./node_modules' --exclude='./.git' --exclude='./var' \
            -C "${GITHUB_WORKSPACE}" -cf - . \
            | docker compose exec -T makamujo tar -xf - -C /opt/src/makamujo
          docker compose exec -T makamujo bash -c 'cd /opt/src/makamujo && /root/.bun/bin/bun install --production --frozen-lockfile'
          docker compose exec -T makamujo bash -c 'cd /opt/src/makamujo && /root/.bun/bin/bunx playwright install chromium' || true
          docker compose exec -T makamujo systemctl set-environment VIGILANT_FIESTA_TITLE_DWELL_MS=3600000 GAME_ACTIVITY_TIMEOUT_MS=7200000
          # The provisioned image is cached by infrastructure files only, so it
          # can carry an overlay page cached by OBS's browser source from an
          # earlier revision. Clearing the Playwright XDG cache alone leaves
          # that page in the OBS Chromium profile: the browser source then
          # renders blank and the capture shows only the game screen.
          docker compose exec -T makamujo rm -rf \
            /opt/src/makamujo/.cache \
            '/opt/src/makamujo/obs-studio/plugin_config/obs-browser/Default/Cache' \
            '/opt/src/makamujo/obs-studio/plugin_config/obs-browser/Default/Code Cache' \
            /opt/src/makamujo/obs-studio/plugin_config/obs-browser/Default/GPUCache \
            /opt/src/makamujo/obs-studio/plugin_config/obs-browser/GPUPersistentCache
          docker compose exec -T makamujo systemctl restart makamujo-screen.service makamujo-browser.service
          # The Comment browser source loads the overlay page and its JS bundle
          # once when OBS starts. Wait until both are served with 200 so a 503
          # from the frontend build cannot be cached as a blank overlay.
          overlay_ready=false
          for _ in $(seq 1 60); do
            if docker compose exec -T makamujo curl -fsS http://127.0.0.1:7777/ >/dev/null 2>&1 \
               && docker compose exec -T makamujo curl -fsS http://127.0.0.1:7777/frontend.js >/dev/null 2>&1; then
              overlay_ready=true
              break
            fi
            sleep 2
          done
          if [ "${overlay_ready}" != true ]; then
            echo "Overlay page was not ready before starting OBS" >&2
            exit 1
          fi
          docker compose exec -T makamujo systemctl start makamujo-obs.service
          sleep 30
          for _ in $(seq 1 30); do
            if docker compose exec -T makamujo systemctl is-active --quiet makamujo-screen.service; then
              break
            fi
            sleep 1
          done

      - name: Point the reproduced OBS at the local RTMPS endpoint
        run: |
          set -euo pipefail
          rtmps_url=rtmps://mediamtx:1936/live/stream

          # OBS (Flatpak) needs the per-run CA in its own runtime trust store.
          docker compose exec -T makamujo sh -c '
            set -eu
            runtime_ref=$(flatpak info --show-runtime com.obsproject.Studio)
            runtime_dir=$(flatpak info --show-location "${runtime_ref}")
            cert_dir="${runtime_dir}/files/etc/ssl/certs"
            if [ ! -d "${cert_dir}" ]; then
              cert_dir="${runtime_dir}/files/usr/etc/ssl/certs"
            fi
            if [ ! -d "${cert_dir}" ]; then
              bundle=$(find "${runtime_dir}" -name ca-certificates.crt -print 2>/dev/null | head -n 1 || true)
              cert_dir=$(dirname "${bundle:-/nonexistent}")
            fi
            test -d "${cert_dir}" || {
              echo "Flatpak runtime trust store not found" >&2
              exit 1
            }
            cp /usr/local/share/ca-certificates/mediamtx-ca.crt \
              "${cert_dir}/mediamtx-ca.crt"
          '
          docker compose exec -T makamujo flatpak override --system \
            --env=SSL_CERT_FILE=/etc/ssl/certs/mediamtx-ca.crt \
            com.obsproject.Studio

          # OBS rewrites its profile on exit, so stop it before touching the
          # files on disk. Only the local RTMPS streaming endpoint is
          # overridden; the deployed profile (including the makamujo overlay
          # page served on 127.0.0.1:7777) stays untouched so the capture
          # exercises the reproduced makamujo instance.
          docker compose exec -T makamujo systemctl stop makamujo-obs.service
          docker compose exec -T makamujo python3 - "${rtmps_url}" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          rtmps_url = sys.argv[1]
          service_path = Path("/opt/src/makamujo/obs-studio/basic/profiles/Makamujo/service.json")

          url = urlsplit(rtmps_url)
          stream_key = url.path.rstrip("/").rsplit("/", 1)[-1]
          server_prefix = url._replace(
              path=url.path.rstrip("/")[: -len(stream_key)].rstrip("/")
          ).geturl()

          service = json.loads(service_path.read_text(encoding="utf-8"))
          service["type"] = "rtmp_custom"
          settings = service.setdefault("settings", {})
          settings["server"] = server_prefix
          settings["key"] = stream_key
          service_path.write_text(
              json.dumps(service, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          # `systemctl start --wait` waits for the unit to *stop* again, not for
          # readiness, so it is not usable for a long-running unit. `systemctl
          # start` returns once the unit is activated (for Type=simple that is
          # right after fork; other types also return after activation, not
          # readiness); poll is-active to wait for readiness.
          docker compose exec -T makamujo systemctl start makamujo-obs.service
          for _ in $(seq 1 30); do
            if docker compose exec -T makamujo systemctl is-active --quiet makamujo-obs.service; then
              echo "OBS is streaming makamujo to ${rtmps_url}"
              exit 0
            fi
            sleep 1
          done
          docker compose exec -T makamujo systemctl status makamujo-obs.service --no-pager -l >&2 || true
          echo "OBS failed to start after applying the local overrides" >&2
          exit 1

      - name: Run RTMPS VRT against mediamtx
        env:
          RTMPS_VRT_MIN_SSIM: ${{ vars.RTMPS_VRT_MIN_SSIM }}
          RTMPS_CAPTURE_URL: "rtmps://localhost:1936/live/stream"
        run: bash tests/vrt-rtmps.sh

      - name: Upload captured VRT images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vrt-rtmps-captured
          path: tests/vrt-rtmps/*.png

      - name: Cleanup
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/ca.pem" makamujo-provisioned.tar
          docker compose down -v --remove-orphans || true
