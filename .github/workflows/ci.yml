name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy
  # CD（cd.yml）が CI の push run を待てなかったときにここから起動する。
  # workflow_dispatch は GITHUB_TOKEN / App token でも発火するため、
  # push イベントが起きないマージでも CI → CD の経路を構成できる。
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        # bin/ のエントリポイント (start / stop / makamujo-pipewire) は拡張子なしなので
        # '*.sh' だけでは lint されず、起動に直結するスクリプトが検査を素通りしていた。
        run: |
          find bin scripts -type f \( -name '*.sh' -o -name start -o -name stop -o -name makamujo-pipewire \) -print0 \
            | xargs -0 -r shellcheck

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run VRT
        run: bash tests/vrt.sh

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  rtmps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl sshpass ffmpeg
          pip install -r ansible/requirements.txt

      - name: Prepare RTMPS certificates
        run: |
          set -euo pipefail
          cert_dir="${RUNNER_TEMP}/certs"
          mkdir -p "${cert_dir}"
          echo "RTMPS_CERTS_DIR=${cert_dir}" >> "${GITHUB_ENV}"
          # Use a real CA + server-certificate chain. A bare self-signed leaf is
          # rejected by some TLS stacks even when it is placed in the trust
          # store, and both ffmpeg (capture) and OBS (publisher) must trust it.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "${cert_dir}/ca-key.pem" \
            -out "${cert_dir}/ca.pem" \
            -subj /CN=makamujo-rtmps-ca \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout "${cert_dir}/key.pem" \
            -out "${cert_dir}/cert.csr" \
            -subj /CN=mediamtx
          cat > "${cert_dir}/ext.cnf" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:mediamtx,DNS:localhost,IP:127.0.0.1
          EOF
          openssl x509 -req \
            -in "${cert_dir}/cert.csr" \
            -CA "${cert_dir}/ca.pem" \
            -CAkey "${cert_dir}/ca-key.pem" \
            -CAcreateserial -days 1 \
            -out "${cert_dir}/cert.pem" \
            -extfile "${cert_dir}/ext.cnf"

      - name: Trust the RTMPS CA on the runner
        run: |
          set -euo pipefail
          sudo cp "${RTMPS_CERTS_DIR}/ca.pem" /usr/local/share/ca-certificates/mediamtx-ca.crt
          sudo update-ca-certificates

      - name: Start the Docker Compose stack
        run: |
          set -euo pipefail
          # The makamujo service has an sshd healthcheck in compose.yml, so wait
          # for it to become healthy instead of polling pgrep manually.
          docker compose up -d --wait --wait-timeout 120 makamujo mediamtx

      - name: Provision the container with Ansible
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook -i inventories/docker.yml playbooks/0_bootstrap.yml
          ansible-playbook -i inventories/docker.yml playbooks/0_desktop.yml
          ansible-playbook -i inventories/docker.yml playbooks/0_obs.yml
          ansible-playbook -i inventories/docker.yml playbooks/1_bun.yml
          ansible-playbook -i inventories/docker.yml playbooks/2_makamujo.yml

      - name: Point the reproduced OBS at the local RTMPS endpoint
        run: |
          set -euo pipefail
          rtmps_url=rtmps://mediamtx:1936/live/stream
          game_url=https://www.nahcnuj.work/vigilant-fiesta/

          # The OBS publisher (a Flatpak app) and the ffmpeg capture both need
          # to trust the temporary CA. Flatpak has its own runtime trust store.
          docker compose cp "${RTMPS_CERTS_DIR}/ca.pem" \
            makamujo:/usr/local/share/ca-certificates/mediamtx-ca.crt
          docker compose exec -T makamujo update-ca-certificates
          docker compose exec -T makamujo sh -c '
            set -eu
            runtime_ref=$(flatpak info --show-runtime com.obsproject.Studio)
            runtime_dir=$(flatpak info --show-location "${runtime_ref}")
            cert_dir="${runtime_dir}/files/etc/ssl/certs"
            if [ ! -d "${cert_dir}" ]; then
              cert_dir="${runtime_dir}/files/usr/etc/ssl/certs"
            fi
            if [ ! -d "${cert_dir}" ]; then
              bundle=$(find "${runtime_dir}" -name ca-certificates.crt -print 2>/dev/null | head -n 1 || true)
              cert_dir=$(dirname "${bundle:-/nonexistent}")
            fi
            test -d "${cert_dir}" || {
              echo "Flatpak runtime trust store not found" >&2
              exit 1
            }
            cp /usr/local/share/ca-certificates/mediamtx-ca.crt \
              "${cert_dir}/mediamtx-ca.crt"
          '
          docker compose exec -T makamujo flatpak override --system \
            --env=SSL_CERT_FILE=/usr/local/share/ca-certificates/mediamtx-ca.crt \
            com.obsproject.Studio

          # OBS rewrites its profile on exit, so stop it before touching the
          # files on disk. Only the local streaming endpoint and the VRT view
          # of the real game page are overridden; encoding and the rest of the
          # deployed profile stay untouched.
          docker compose exec -T makamujo systemctl stop makamujo-obs.service
          for _ in $(seq 1 30); do
            if ! docker compose exec -T makamujo systemctl is-active --quiet makamujo-obs.service; then
              break
            fi
            sleep 1
          done
          if docker compose exec -T makamujo systemctl is-active --quiet makamujo-obs.service; then
            echo "OBS did not stop before applying the local overrides" >&2
            exit 1
          fi
          docker compose exec -T makamujo python3 - "${rtmps_url}" "${game_url}" <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit

          rtmps_url, game_url = sys.argv[1:3]
          service_path = Path("/opt/src/makamujo/obs-studio/basic/profiles/Makamujo/service.json")
          scene_path = Path("/opt/src/makamujo/obs-studio/basic/scenes/Makamujo.json")

          url = urlsplit(rtmps_url)
          stream_key = url.path.rstrip("/").rsplit("/", 1)[-1]
          server_prefix = url._replace(
              path=url.path.rstrip("/")[: -len(stream_key)].rstrip("/")
          ).geturl()

          service = json.loads(service_path.read_text(encoding="utf-8"))
          service["type"] = "rtmp_custom"
          settings = service.setdefault("settings", {})
          settings["server"] = server_prefix
          settings["key"] = stream_key
          service_path.write_text(
              json.dumps(service, ensure_ascii=False, separators=(",", ":")), encoding="utf-8"
          )

          scene = json.loads(scene_path.read_text(encoding="utf-8"))
          for source in scene.get("sources", []):
              if source.get("name") == "Comment":
                  source.setdefault("settings", {})["url"] = game_url
          scene_path.write_text(
              json.dumps(scene, ensure_ascii=False, separators=(",", ":")), encoding="utf-8"
          )
          PY
          docker compose exec -T makamujo systemctl start makamujo-obs.service
          for _ in $(seq 1 30); do
            if docker compose exec -T makamujo systemctl is-active --quiet makamujo-obs.service; then
              echo "OBS is streaming vigilant-fiesta (${game_url}) to ${rtmps_url}"
              exit 0
            fi
            sleep 1
          done
          docker compose exec -T makamujo systemctl status makamujo-obs.service --no-pager -l >&2 || true
          echo "OBS failed to start after applying the local overrides" >&2
          exit 1

      - name: Run RTMPS VRT against mediamtx
        run: |
          set -euo pipefail
          RTMPS_CAPTURE_URL=rtmps://localhost:1936/live/stream bash tests/vrt-rtmps.sh

      - name: Dump RTMPS diagnostics
        if: always()
        run: |
          set -uo pipefail
          echo '== MediaMTX logs =='
          docker compose logs --no-color --tail 200 mediamtx 2>&1 || true
          echo '== OBS service status =='
          docker compose exec -T makamujo systemctl status makamujo-obs.service --no-pager -l 2>&1 || true
          echo '== OBS journal =='
          docker compose exec -T makamujo journalctl -u makamujo-obs.service --no-pager -n 300 2>&1 || true
          echo '== OBS application logs =='
          docker compose exec -T makamujo sh -c '
            for f in /opt/src/makamujo/obs-studio/logs/*.log; do
              [ -f "$f" ] || continue
              echo "--- $f"
              tail -n 200 "$f"
            done
          ' 2>&1 || true
          echo '== OBS service config =='
          docker compose exec -T makamujo cat \
            /opt/src/makamujo/obs-studio/basic/profiles/Makamujo/service.json 2>&1 || true
          echo '== Flatpak overrides =='
          docker compose exec -T makamujo flatpak override --system --show com.obsproject.Studio 2>&1 || true
          echo '== CA trust store =='
          docker compose exec -T makamujo sh -c 'ls -l /etc/ssl/certs/*mediamtx* 2>&1; cat /usr/local/share/ca-certificates/mediamtx-ca.crt 2>&1 | head -3' || true
          echo '== CA in Flatpak sandbox =='
          docker compose exec -T -e XDG_RUNTIME_DIR=/run/user/0 -e DISPLAY=:10 makamujo \
            flatpak run --command=sh com.obsproject.Studio -c \
            'ls -l /etc/ssl/certs/mediamtx-ca.crt' 2>&1 || true
          echo '== Game page reachability =='
          docker compose exec -T makamujo python3 -c \
            'import urllib.request; print(urllib.request.urlopen("https://www.nahcnuj.work/vigilant-fiesta/", timeout=5).status)' \
            2>&1 || true
          echo '== RTMPS hostname resolution =='
          docker compose exec -T makamujo getent hosts mediamtx 2>&1 || true

      - name: Upload captured VRT images
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vrt-rtmps-captured
          path: tests/vrt-rtmps/*.png

      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
