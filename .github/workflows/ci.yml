name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy
  # CD（cd.yml）が CI の push run を待てなかったときにここから起動する。
  # workflow_dispatch は GITHUB_TOKEN / App token でも発火するため、
  # push イベントが起きないマージでも CI → CD の経路を構成できる。
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        # bin/ のエントリポイント (start / stop / makamujo-pipewire) は拡張子なしなので
        # '*.sh' だけでは lint されず、起動に直結するスクリプトが検査を素通りしていた。
        run: |
          find bin scripts -type f \( -name '*.sh' -o -name start -o -name stop -o -name makamujo-pipewire \) -print0 \
            | xargs -0 -r shellcheck

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Install openssh-server (bin) for honeypot-hold test
        if: matrix.suite.label == 'bin'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  fail2ban-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install fail2ban
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fail2ban
      - name: Test the fail2ban configuration in a temp dir
        # 本番と同じ base+overlay を /etc に触らず検証するため、-c で一時ディレクトリを指定する
        run: |
          stage="$(mktemp -d)"
          cp -a /etc/fail2ban/. "$stage/"
          cp -a etc/fail2ban/. "$stage/"
          fail2ban-client -c "$stage" -t
      - name: Verify the sshd jail reads the ssh journal
        # systemd が PID 1 ではない runner では jail を起動できないため、backend と journalmatch の定義を直接検証する
        run: |
          grep -Eq '^backend = systemd$' etc/fail2ban/jail.d/sshd-honeypot.conf
          grep -Eq '^journalmatch = _SYSTEMD_UNIT=ssh\.service \+ _COMM=sshd \+ _COMM=sshd-session$' etc/fail2ban/jail.d/sshd-honeypot.conf

  streaming-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Debian 13 container
        run: docker build -t makamujo/debian13 -f docker/Dockerfile .

      - name: Start Debian 13 container
        run: |
          set -euo pipefail
          docker run -d --name makamujo-debian13 \
            --privileged \
            -p 2222:22 \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            makamujo/debian13

      - name: Wait for container and configure SSH
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker exec makamujo-debian13 true; then break; fi
            sleep 2
          done
          docker exec makamujo-debian13 cat /etc/os-release

          ssh-keygen -t ed25519 -N "" -f /tmp/debian13_key
          docker exec makamujo-debian13 mkdir -p /root/.ssh
          docker cp /tmp/debian13_key.pub makamujo-debian13:/root/.ssh/authorized_keys
          docker exec makamujo-debian13 chmod 700 /root/.ssh
          docker exec makamujo-debian13 chmod 600 /root/.ssh/authorized_keys

          mkdir -p ~/.ssh
          cp /tmp/debian13_key ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          for i in $(seq 1 30); do
            if ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy root@127.0.0.1 true 2>/dev/null; then
              break
            fi
            sleep 2
          done
          ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy root@127.0.0.1 true

      - name: Install Ansible on runner
        run: pip install -r ansible/requirements.txt

      - name: Prepare Ansible vault for CI
        run: |
          set -euo pipefail
          printf 'ci-dummy-vault-password\n' > ansible/.vault_pass
          chmod 600 ansible/.vault_pass
          printf 'niconama_stream_key: ""\n' > ansible/inventory/group_vars/all/vault.yml

      - name: Install capture tools on runner
        run: sudo apt-get update && sudo apt-get install -y tcpdump

      - name: Provision production
        env:
          VPS_SSH_HOST: 127.0.0.1
          VPS_SSH_USER: root
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_SSH_COMMON_ARGS: -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -p 2222
        run: |
          set -euo pipefail
          DEPLOY_PLAYBOOK=ansible/playbooks/0_bootstrap.yml bin/deploy.sh
          DEPLOY_PLAYBOOK=ansible/playbooks/1_bun.yml bin/deploy.sh
          bin/deploy.sh

      - name: Install RTMPS traffic generator
        run: |
          set -euo pipefail
          docker cp bin/observe-rtmps.sh makamujo-debian13:/usr/local/bin/observe-rtmps.sh
          docker exec makamujo-debian13 chmod 0755 /usr/local/bin/observe-rtmps.sh

      - name: Observe outbound RTMPS traffic
        env:
          RTMPS_URL: rtmps://example.com/live/stream
        run: |
          set -euo pipefail
          sudo rm -f /tmp/rtmps-capture.pcap
          sudo tcpdump -i any -w /tmp/rtmps-capture.pcap 'tcp port 443 or tcp port 1935 or tcp port 1936' &
          TCPDUMP_PID=$!
          sleep 1
          docker exec -e RTMPS_URL="$RTMPS_URL" makamujo-debian13 /usr/local/bin/observe-rtmps.sh || true
          sleep 2
          sudo kill "$TCPDUMP_PID" 2>/dev/null || true
          wait "$TCPDUMP_PID" 2>/dev/null || true
          sudo test -s /tmp/rtmps-capture.pcap
          echo "RTMPS communication observed"

      - name: Cleanup
        if: always()
        run: docker rm -f makamujo-debian13 || true
