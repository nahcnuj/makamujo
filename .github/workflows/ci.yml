name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: find bin -type f -name '*.sh' -print0 | xargs -0 shellcheck

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Install openssh-server (bin) for honeypot-hold test
        if: matrix.suite.label == 'bin'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Configure apt mirror (JAIST)
        if: matrix.suite.label == 'e2e'
        # runner image は apt の取得先を mirrorlist ファイル (/etc/apt/apt-mirrors.txt) 経由で
        # 決めているため、sources ファイルに azure.archive.ubuntu.com が書かれておらず sed では
        # 差し替えられない。apt 全体の source を JAIST 固定に差し替え、
        # `apt-get update --print-uris` で実際に取得する URI が JAIST だけであることを検証する。
        # apt.conf.d は sudo 経由（含 `playwright install --with-deps` 内）の apt にも効く。
        run: |
          set -euo pipefail
          sudo mkdir -p /var/tmp/ci-apt/sourceparts
          sudo tee /var/tmp/ci-apt/sources.list >/dev/null <<'EOF'
          deb http://ftp.jaist.ac.jp/pub/Linux/ubuntu noble main restricted universe multiverse
          deb http://ftp.jaist.ac.jp/pub/Linux/ubuntu noble-updates main restricted universe multiverse
          deb http://ftp.jaist.ac.jp/pub/Linux/ubuntu noble-backports main restricted universe multiverse
          deb http://ftp.jaist.ac.jp/pub/Linux/ubuntu noble-security main restricted universe multiverse
          EOF
          sudo tee /etc/apt/apt.conf.d/99-ci-mirror.conf >/dev/null <<'EOF'
          Dir::Etc::sourcelist "/var/tmp/ci-apt/sources.list";
          Dir::Etc::sourceparts "/var/tmp/ci-apt/sourceparts";
          EOF
          non_jaist="$(apt-get update --print-uris 2>&1 | tr -d "'" | awk '{print $1}' | grep '^http' | grep -v '^http://ftp\.jaist\.ac\.jp/' || true)"
          if [ -n "$non_jaist" ]; then
            echo 'apt would still fetch from a non-JAIST mirror:'
            echo "$non_jaist"
            exit 1
          fi
          jaist_uris="$(apt-get update --print-uris 2>&1 | tr -d "'" | awk '{print $1}' | grep -c '^http://ftp\.jaist\.ac\.jp/' || true)"
          if [ "$jaist_uris" -eq 0 ]; then
            echo 'no JAIST URI reported by apt-get update --print-uris'
            exit 1
          fi
          echo "apt sources are pinned to JAIST ($jaist_uris URIs)"
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  fail2ban-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fail2ban
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fail2ban
      - name: Test the fail2ban configuration in a temp dir
        # 本番と同じ base+overlay を /etc に触らず検証するため、-c で一時ディレクトリを指定する
        run: |
          stage="$(mktemp -d)"
          cp -a /etc/fail2ban/. "$stage/"
          cp -a etc/fail2ban/. "$stage/"
          fail2ban-client -c "$stage" -t
      - name: Verify the sshd jail reads the ssh journal
        # systemd が PID 1 ではない runner では jail を起動できないため、backend と journalmatch の定義を直接検証する
        run: |
          grep -Eq '^backend = systemd$' etc/fail2ban/jail.d/sshd-honeypot.conf
          grep -Eq '^journalmatch = _SYSTEMD_UNIT=ssh\.service \+ _COMM=sshd \+ _COMM=sshd-session$' etc/fail2ban/jail.d/sshd-honeypot.conf
