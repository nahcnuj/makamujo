name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy
  # CD（cd.yml）が CI の push run を待てなかったときにここから起動する。
  # workflow_dispatch は GITHUB_TOKEN / App token でも発火するため、
  # push イベントが起きないマージでも CI → CD の経路を構成できる。
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run ShellCheck
        # bin/ のエントリポイント (start / stop / makamujo-pipewire) は拡張子なしなので
        # '*.sh' だけでは lint されず、起動に直結するスクリプトが検査を素通りしていた。
        run: |
          find bin scripts -type f \( -name '*.sh' -o -name start -o -name stop -o -name makamujo-pipewire \) -print0 \
            | xargs -0 -r shellcheck

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  vrt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run VRT
        run: bash tests/vrt.sh

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  rtmps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg openssl sshpass
          pip install -r ansible/requirements.txt

      - name: Prepare RTMPS server
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/certs"
          # Use a real CA + server-certificate chain. A bare self-signed leaf is
          # rejected by some TLS stacks even when it is placed in the trust
          # store, and both ffmpeg (capture) and OBS (publisher) must trust it.
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "${RUNNER_TEMP}/certs/ca-key.pem" \
            -out "${RUNNER_TEMP}/certs/ca.pem" \
            -subj /CN=makamujo-rtmps-ca \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout "${RUNNER_TEMP}/certs/key.pem" \
            -out "${RUNNER_TEMP}/certs/cert.csr" \
            -subj /CN=mediamtx
          cat > "${RUNNER_TEMP}/certs/ext.cnf" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:mediamtx,DNS:localhost,IP:127.0.0.1
          EOF
          openssl x509 -req \
            -in "${RUNNER_TEMP}/certs/cert.csr" \
            -CA "${RUNNER_TEMP}/certs/ca.pem" \
            -CAkey "${RUNNER_TEMP}/certs/ca-key.pem" \
            -CAcreateserial -days 1 \
            -out "${RUNNER_TEMP}/certs/cert.pem" \
            -extfile "${RUNNER_TEMP}/certs/ext.cnf"
          sudo cp "${RUNNER_TEMP}/certs/ca.pem" /usr/local/share/ca-certificates/mediamtx-ca.crt
          sudo update-ca-certificates
          cat > "${RUNNER_TEMP}/mediamtx.yml" <<'EOF'
          rtmp: yes
          rtmpEncryption: strict
          rtmpsAddress: :1936
          rtmpServerKey: /certs/key.pem
          rtmpServerCert: /certs/cert.pem
          paths:
            all_others:
          EOF
          docker network create makamujo

      - name: Build and start the production container
        run: |
          set -euo pipefail
          docker build -t makamujo:prod .
          docker run -d --name makamujo --network makamujo \
            --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -p 2222:22 \
            makamujo:prod
          for _ in $(seq 1 30); do
            if docker exec makamujo pgrep -x sshd >/dev/null 2>&1; then
              echo "sshd is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs makamujo
          exit 1

      - name: Start the RTMPS server on the Docker network
        run: |
          set -euo pipefail
          docker run -d --name mediamtx --network makamujo \
            -p 1936:1936 \
            -v "${RUNNER_TEMP}/mediamtx.yml:/mediamtx.yml:ro" \
            -v "${RUNNER_TEMP}/certs:/certs:ro" \
            bluenviron/mediamtx:1.9.3
          sleep 2
          docker logs mediamtx

      - name: Provision the container with Ansible
        working-directory: ansible
        run: |
          set -euo pipefail
          ansible-playbook -i inventories/docker.yml playbooks/0_bootstrap.yml
          ansible-playbook -i inventories/docker.yml playbooks/0_desktop.yml
          ansible-playbook -i inventories/docker.yml playbooks/0_obs.yml
          ansible-playbook -i inventories/docker.yml playbooks/1_bun.yml
          ansible-playbook -i inventories/docker.yml playbooks/2_makamujo.yml

      - name: Point OBS at the RTMPS server
        run: |
          set -euo pipefail
          docker cp "${RUNNER_TEMP}/certs/ca.pem" \
            makamujo:/usr/local/share/ca-certificates/mediamtx-ca.crt
          docker exec makamujo update-ca-certificates
          # Flathub's OBS is built with mbedTLS. Its librtmp loads trust anchors
          # from /etc/ssl/certs *inside its sandbox* and ignores SSL_CERT_FILE.
          # Flatpak populates that directory from the runtime and refuses to
          # share the host's /etc or /usr, so install the CA into the runtime's
          # trust store directly.
          docker exec makamujo sh -c '
            set -eu
            runtime_ref=$(flatpak info --show-runtime com.obsproject.Studio)
            runtime_dir=$(flatpak info --show-location "${runtime_ref}")
            echo "Flatpak runtime: ${runtime_ref} at ${runtime_dir}"
            cert_dir="${runtime_dir}/files/etc/ssl/certs"
            if [ ! -d "${cert_dir}" ]; then
              cert_dir="${runtime_dir}/files/usr/etc/ssl/certs"
            fi
            if [ ! -d "${cert_dir}" ]; then
              bundle=$(find "${runtime_dir}" -name ca-certificates.crt -print 2>/dev/null | head -n 1 || true)
              cert_dir=$(dirname "${bundle:-/nonexistent}")
            fi
            test -d "${cert_dir}" || {
              echo "Flatpak runtime trust store not found" >&2
              exit 1
            }
            cp /usr/local/share/ca-certificates/mediamtx-ca.crt \
              "${cert_dir}/mediamtx-ca.crt"
            ls -l "${cert_dir}/mediamtx-ca.crt"
          '
          docker exec makamujo flatpak override --system \
            --env=SSL_CERT_FILE=/usr/local/share/ca-certificates/mediamtx-ca.crt \
            com.obsproject.Studio
          bash tests/rtmps/configure-obs.sh makamujo

      - name: Run RTMPS VRT
        run: bash tests/vrt-rtmps.sh

      - name: Dump RTMPS diagnostics
        if: always()
        run: |
          set -uo pipefail
          echo '== MediaMTX logs =='
          docker logs mediamtx --tail 200 2>&1 || true
          echo '== OBS service status =='
          docker exec makamujo systemctl status makamujo-obs.service --no-pager -l 2>&1 || true
          echo '== OBS journal =='
          docker exec makamujo journalctl -u makamujo-obs.service --no-pager -n 300 2>&1 || true
          echo '== OBS application logs =='
          docker exec makamujo sh -c '
            for f in /opt/src/makamujo/obs-studio/logs/*.log; do
              [ -f "$f" ] || continue
              echo "--- $f"
              tail -n 200 "$f"
            done
          ' 2>&1 || true
          echo '== OBS service config =='
          docker exec makamujo cat \
            /opt/src/makamujo/obs-studio/basic/profiles/Makamujo/service.json 2>&1 || true
          echo '== Flatpak overrides =='
          docker exec makamujo flatpak override --system --show com.obsproject.Studio 2>&1 || true
          echo '== CA trust store =='
          docker exec makamujo sh -c 'ls -l /etc/ssl/certs/*mediamtx* 2>&1; cat /usr/local/share/ca-certificates/mediamtx-ca.crt 2>&1 | head -3' || true
          echo '== CA in Flatpak sandbox =='
          docker exec -e XDG_RUNTIME_DIR=/run/user/0 -e DISPLAY=:10 makamujo \
            flatpak run --command=sh com.obsproject.Studio -c \
            'ls -l /etc/ssl/certs/mediamtx-ca.crt' 2>&1 || true
          echo '== Fixture reachability =='
          docker exec makamujo python3 -c \
            'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8899/fixture.html", timeout=2).status)' \
            2>&1 || true
          echo '== RTMPS hostname resolution =='
          docker exec makamujo getent hosts mediamtx 2>&1 || true

      - name: Upload captured VRT images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vrt-rtmps-captured
          path: tests/vrt-rtmps/*.png

      - name: Cleanup
        if: always()
        run: |
          docker rm -f makamujo mediamtx || true
          docker network rm makamujo || true
