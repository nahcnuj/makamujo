name: CI

on:
  push:
    branches:
      - main
      - legacy
  pull_request:
    branches:
      - main
      - legacy

# Least-privilege default for GITHUB_TOKEN across all jobs.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './bin'

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun ci
      - name: Save node_modules to cache
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers cache
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run Biome linter
        run: |
          bunx biome check . --diagnostic-level=warn --max-diagnostics=none

  typecheck:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          fail-on-cache-miss: true
      - name: Run tsc --noEmit
        run: bun run typecheck

  test:
    needs: [setup, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { script: test, label: unit }
          - { script: test:integration, label: integration }
          - { script: test:bin, label: bin }
          - { script: test:e2e, label: e2e }
    name: test (${{ matrix.suite.label }})
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Restore node_modules from cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Restore Playwright browsers cache (if available)
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (integration / e2e)
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        run: bunx playwright install chromium
      - name: Install openssh-server (bin) for honeypot-hold test
        if: matrix.suite.label == 'bin'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
      - name: Configure apt mirror (JAIST)
        if: matrix.suite.label == 'e2e'
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://ftp.jaist.ac.jp/pub/Linux/ubuntu|g' /etc/apt/sources.list
      - name: Allow binding to port 443 without root
        if: matrix.suite.label == 'e2e'
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
      - name: Run ${{ matrix.suite.label }} tests
        run: bun run ${{ matrix.suite.script }}
      - name: Save Playwright browsers cache
        if: matrix.suite.label == 'integration' || matrix.suite.label == 'e2e'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

  ansible-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install "ansible-core>=2.16,<2.19"
      - name: Syntax-check playbooks
        working-directory: ansible
        # Avoid real inventory (vault). localhost inventory loads no group_vars vault.
        run: |
          set -e
          for f in playbooks/*.yml; do
            echo "==> $f"
            ansible-playbook --syntax-check -i localhost, -c local "$f"
          done

  fail2ban-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install fail2ban
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fail2ban
      - name: Install the fail2ban config from etc/
        # fail2ban-client only reads the standard tree at /etc/fail2ban, and the
        # repo checkout's etc/fail2ban/ is just an overlay (action.d/*, *.local,
        # jail.d/*) that the apt base config turns into a runnable tree. Stage
        # the overlay at the same path and mode the deploy playbook uses, so the
        # test and grep below validate the config exactly as deployed. Writing
        # to /etc is root-only, hence sudo.
        run: sudo cp -r etc/fail2ban/. /etc/fail2ban/
      - name: Test the fail2ban configuration
        # Reads the /etc/fail2ban tree installed above; the test itself needs no
        # root, so it runs as the normal runner user.
        run: fail2ban-client -t
      - name: Verify the sshd jail reads the ssh journal
        # GitHub runners boot without systemd as PID 1, so the jail cannot be
        # started against a live journal here; assert the systemd backend and
        # journalmatch we rely on instead (a regression guard for reverting to
        # /var/log/auth.log reading). The deploy playbook still fails loudly if
        # the config is invalid, since fail2ban.service will not start.
        run: |
          grep -Eq '^backend = systemd$' /etc/fail2ban/jail.d/sshd-honeypot.conf
          grep -Eq '^journalmatch = _SYSTEMD_UNIT=ssh\.service \+ _COMM=sshd \+ _COMM=sshd-session$' /etc/fail2ban/jail.d/sshd-honeypot.conf
