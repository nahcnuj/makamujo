name: Owner-approved auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    uses: nahcnuj/conahcnuj/.github/workflows/owner-approved-auto-merge.yml@23943f9a8fa3400730dd6425017be6d3cab7235c
    with:
      repository: ${{ github.repository }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      merge-method: squash
    secrets:
      auto-merge-token: ${{ secrets.AUTO_MERGE_TOKEN }}
