name: Owner-approved auto-merge

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  # 呼び出し先の workflow が `gh workflow run` で cd.yml を dispatch するため必須。
  # ここを grants しないと workflow 自体の検証エラー（startup_failure）になる。
  actions: write

jobs:
  enable:
    uses: nahcnuj/conahcnuj/.github/workflows/owner-approved-auto-merge.yml@f8484050d7d27d28fe1466aed69583478d9010d7
    with:
      repository: ${{ github.repository }}
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      merge-method: squash
      # GITHUB_TOKEN のマージでは push イベントが起きないため、デプロイは明示的に起動する
      post-merge-dispatch: cd.yml
