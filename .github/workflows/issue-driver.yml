name: Issue Driver

# Drive an issue (or continue a pull request) with the conahcnuj driver.
#
# The driver itself - checking out conahcnuj, staging the GitHub App private
# key and app.env, installing opencode, running bin/conahcnuj.sh, and filing a
# bug report on failure - lives in nahcnuj/conahcnuj. This workflow only
# forwards the number and the target repository, so the two repositories cannot
# drift apart. Pin the reusable workflow to a commit so an upstream change
# cannot alter this repository's CI without a review.
on:
  # The driver's continuation comment links here as issue-driver.yml with a
  # `number` input, so keep this filename and input name stable.
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number

permissions:
  contents: read

jobs:
  drive:
    name: Drive fix
    uses: nahcnuj/conahcnuj/.github/workflows/issue-driver.yml@dedc0091d368773aa5bbb0ec5e882737209aa334
    with:
      number: ${{ inputs.number }}
      # The caller's repository owns the issue; the reusable workflow's
      # default would drive conahcnuj instead.
      repository: ${{ github.repository }}
    secrets: inherit
