name: Auto-drive

on:
  issues:
    types:
      # - opened
      - reopened
  pull_request_review:
    types: [submitted, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to drive
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  auto-drive:
    name: Auto-drive issue
    uses: conahcnuj/conahcnuj/.github/workflows/issue-driver.yml@515844b7d4d3e11f98d8ae68c2a4f6f314e609c1
    with:
      number: ${{ github.event.pull_request.number || github.event.issue.number || (github.event.inputs.number && fromJSON(github.event.inputs.number)) }}
      repository: ${{ github.repository }}
      environment: conahcnuj
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
