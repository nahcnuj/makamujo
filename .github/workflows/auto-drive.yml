name: Issue Driver

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to address'
        required: true
        type: string
      issue_title:
        description: 'Issue title'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drive:
    name: Drive fix (reusing conahcnuj/issue-driver pattern)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run opencode to fix the issue (conahcnuj pattern)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx opencode --issue ${{ inputs.issue_number }}

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ inputs.issue_number }}');
            const issueTitle = '${{ inputs.issue_title }}';

            const body = `## Auto-drive 開始 (conahcnuj pattern)

Issue **#${issueNumber}** (${issueTitle}) に対して opencode を使用した自動修正を開始しました。
(conahcnuj の issue-driver.yml パターンを再利用しています。)

進捗は PR または Issue のコメントで確認してください。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            console.log(`Started auto-drive for issue #${issueNumber}`);
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun ci

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = '${{ github.event.inputs.issue_number }}';
            const issueTitle = '${{ github.event.inputs.issue_title }}';

            const body = `## Auto-drive 実行完了

Issue **#${issueNumber}** (${issueTitle}) に対する自動修正を試行しました。

**実行内容:**
- 依存関係のインストール (\`bun ci\`)
- 型チェック (\`bun run typecheck\`)
- Lint (\`bun run lint\`)
- 単体テスト (\`bun run test\`)

すべてのチェックが通過しました。問題がコードの不具合によるものであれば、この実行で修正されている可能性があります。

手動での確認が必要な場合は、再度配信状況をチェックしてください。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(issueNumber),
              body
            });

            console.log(`Commented on issue #${issueNumber}`);