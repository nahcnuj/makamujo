name: Issue Driver

on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to address'
        required: true
        type: string
      issue_title:
        description: 'Issue title'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  drive:
    name: Drive fix (reusing conahcnuj/issue-driver pattern)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      ISSUE_TITLE: ${{ inputs.issue_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install dependencies
        run: bun ci

      - name: Run opencode to fix the issue (conahcnuj pattern)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx opencode --issue "$ISSUE_NUMBER"

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER);
            const issueTitle = process.env.ISSUE_TITLE;

            const body = `## Auto-drive 開始 (conahcnuj pattern)

Issue **#${issueNumber}** (${issueTitle}) に対して opencode を使用した自動修正を開始しました。
(conahcnuj の issue-driver.yml パターンを再利用しています。)

進捗は PR または Issue のコメントで確認してください。`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });

            console.log(`Started auto-drive for issue #${issueNumber}`);
