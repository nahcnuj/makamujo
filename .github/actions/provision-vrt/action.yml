name: Provision VRT container
description: Run the Ansible playbooks against a target host (VRT container or VPS)
inputs:
  limit:
    description: Ansible --limit target
    required: false
    default: vrt
  become:
    description: ansible_become value passed via -e
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Provision via Ansible
      shell: bash
      run: |
        for playbook in ansible/playbooks/*.yml; do
          tags=()
          if [ "$(basename "$playbook")" = "0_desktop.yml" ]; then
            tags=(--tags vrt)
          fi
          ansible-playbook -i ansible/inventory/hosts.yml --limit "${{ inputs.limit }}" -e "ansible_become=${{ inputs.become }}" "$playbook" "${tags[@]}"
        done
