# RTMPS endpoint used by the Docker Compose VRT stack. The certificate and key
# are mounted from RTMPS_CERTS_DIR by compose.yml.
# Only settings that differ from MediaMTX defaults are overridden here: strict
# RTMPS encryption plus the mounted certificate/key paths.
rtmpEncryption: strict
rtmpServerKey: /certs/key.pem
rtmpServerCert: /certs/cert.pem
