# Reproduce the production streaming stack with Docker Compose.
# The makamujo service is provisioned from the host by the same Ansible
# playbooks used for the VPS; mediamtx is the RTMPS endpoint on the shared
# Docker network. The optional vrt service captures the published stream from
# inside that network and compares it with the committed baseline.
services:
  makamujo:
    build:
      context: .
      dockerfile: Dockerfile
    image: makamujo:prod
    container_name: makamujo
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2222:22"
    networks:
      - makamujo
    command: ["/sbin/init"]

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: mediamtx
    volumes:
      - ./tests/vrt-rtmps/mediamtx.yml:/mediamtx.yml:ro
      - ${RTMPS_CERTS_DIR:-/tmp/makamujo-rtmps-certs}:/certs:ro
    ports:
      - "1936:1936"
    networks:
      - makamujo

  vrt:
    image: debian:trixie
    container_name: makamujo-vrt
    profiles: [vrt]
    depends_on:
      - mediamtx
    networks:
      - makamujo
    volumes:
      - .:/work
      - ${RTMPS_CERTS_DIR:-/tmp/makamujo-rtmps-certs}/ca.pem:/usr/local/share/ca-certificates/mediamtx-ca.crt:ro
    environment:
      RTMPS_CAPTURE_URL: rtmps://mediamtx:1936/live/stream
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y --no-install-recommends ca-certificates ffmpeg
        update-ca-certificates
        cd /work
        bash tests/vrt-rtmps.sh

networks:
  makamujo:
    name: makamujo
