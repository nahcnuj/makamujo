services:
  makamujo:
    build:
      context: .
      dockerfile: docker/makamujo/Dockerfile
    container_name: makamujo
    privileged: true
    cgroup: host
    ports:
      - "22:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active ssh.service >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 10s

  rtmp-backend:
    image: ossrs/srs:5.0.225

  streaming-server:
    build:
      context: ./docker/streaming-server
      dockerfile: Dockerfile
    depends_on:
      - rtmp-backend
