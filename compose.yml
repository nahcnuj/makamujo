services:
  makamujo-debian13:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: makamujo-debian13
    privileged: true
    cgroup: host
    ports:
      - "2222:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active ssh.service >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rtmp-backend:
    image: ossrs/srs:5

  streaming-server:
    image: nginx:alpine
    depends_on:
      - rtmp-backend
    ports:
      - "8443:443"
    volumes:
      - ./docker/streaming-server/nginx.conf:/etc/nginx/nginx.conf:ro
    command: >
      sh -c "apk add --no-cache openssl &&
      openssl req -x509 -nodes -days 1 -newkey rsa:2048
      -keyout /etc/nginx/key.pem -out /etc/nginx/cert.pem
      -subj /CN=streaming-server &&
      exec nginx -g 'daemon off;'"
