[Definition]
# At [sshd] ban time, run honeypot-report to measure how long the
# IP was served from the first received SSH request until this BAN,
# then journal the record so `journalctl -u fail2ban` shows it.
actionban = journalctl -u fail2ban --no-pager --since=-24h | /usr/local/bin/honeypot-report --ip <ip> --now $(date +%%s) | systemd-cat -t fail2ban-honeypot