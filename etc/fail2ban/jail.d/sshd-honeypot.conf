[sshd]
enabled = true
mode = aggressive
port = ssh
filter = sshd
# Ubuntu cloud images ship without rsyslog, so /var/log/auth.log
# never gets the sshd messages: they only exist in the journal under
# the ssh.service unit (`journalctl -u ssh`). Read that source and
# match both the sshd listener and the OpenSSH 9.8+ sshd-session
# workers that journal pre-auth failures.
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd + _COMM=sshd-session
maxretry = 1
findtime = 86400
bantime = -1
ignoreip = 127.0.0.1/8 ::1
action = iptables-multiport[name=sshd, port="ssh", protocol=tcp, blocktype=DROP]
         honeypot-report